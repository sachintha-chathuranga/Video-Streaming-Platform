spring.application.name=video-service

logging.level.com.fourbit.videostreaming.video_service=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %clr(%-5level) : [%clr(%logger{30}){cyan}] : %m%n

#### Mysql Database #### 
spring.datasource.url=jdbc:mysql://localhost:3306/video_service
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql: true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.port=8083

