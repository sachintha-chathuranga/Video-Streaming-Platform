spring.application.name=user-service

logging.level.com.fourbit.videostreaming=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %clr(%-5level) : [%clr(%logger{30}){cyan}] : %m%n

#### Mysql Database #### 
spring.datasource.url=jdbc:mysql://localhost:3306/user_service
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql: true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Set the maximum request size and file size
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Set url of eureka server to send network details
#eureka.client.service-url.defaultZone=http://eureka:password@localhost:8761/eureka/

server.port=8082

